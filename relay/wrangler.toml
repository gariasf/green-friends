# The blind relay (ADR-0006): stores encrypted Snapshots in R2, never reads them.
name = "green-friends-relay"
main = "src/index.ts"
compatibility_date = "2026-08-22"

[vars]
# The Web view's origin, the only one CORS lets read Snapshots from a browser.
ALLOWED_ORIGIN = "https://green-friends.gariasf.workers.dev"

# Pl@ntNet's API key for Identify (ADR-0007): `tr -d '\n' < ~/.plantnet-key | npx wrangler secret put PLANTNET_KEY`,
# and a git-ignored .dev.vars for `wrangler dev`. Never in the repo.
# APP_TOKEN: the app's own secret, sent as X-App-Token, so only the app can create gardens or use
# the key; ~/.green-friends-app-token, also the app's EXPO_PUBLIC_APP_TOKEN in .env.local.
[secrets]
required = ["PLANTNET_KEY", "APP_TOKEN"]

[[r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "green-friends-snapshots"

# Per client IP, in front of every route (workers.dev has no zone for WAF rules).
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
